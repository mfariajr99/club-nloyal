# Blueprint do Render — cria automaticamente o serviço web e o banco de dados
# DE TESTE, separados do site real (nomes com "-teste" para não colidir com
# o "giftback-app" / "giftback-db" já publicados).
#
# Como usar (resumo; o passo a passo completo está no README.md):
#   1. Suba esta pasta inteira para um repositório NOVO no GitHub (não o mesmo
#      repositório do site real).
#   2. No Render, clique em "New +" > "Blueprint" e aponte para esse repositório novo.
#   3. O Render vai propor a criação do serviço "giftback-app-teste" e do banco
#      "giftback-db-teste" — totalmente separados do site e do banco reais.
#      Clique em "Apply".
#   4. Depois do primeiro deploy, defina a variável PUBLIC_BASE_URL (veja README).

databases:
  - name: giftback-db-teste
    plan: free
    databaseName: giftback_teste
    user: giftback_app_teste

services:
  - type: web
    name: giftback-app-teste
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: giftback-db-teste
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PUBLIC_BASE_URL
        sync: false
